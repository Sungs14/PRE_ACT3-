<section>
  <h2 class="section-title">Key Skills</h2>
  <ul>
    @for (skill of skills(); track skill) {
      <li>
        <button
          type="button"
          class="skill"
          [class.selected]="selected() === skill"
          [attr.aria-pressed]="selected() === skill"
          (click)="selectSkill(skill)">
          {{ skill }}
        </button>
      </li>
    }
  </ul>
</section>
